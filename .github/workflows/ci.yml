name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_editor_protocol:
        description: Run the Resolve protocol checks
        required: true
        default: true
        type: boolean
      run_regression:
        description: Run the legacy Kdenlive/LMMS regression
        required: true
        default: false
        type: boolean
      run_gui_drills:
        description: Run GUI drills
        required: true
        default: false
        type: boolean

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  editor-protocol:
    if: github.event_name == 'push' || inputs.run_editor_protocol
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 类型检查（无 Resolve/GUI）
        run: |
          mkdir -p evidence/editor-protocol
          set -o pipefail
          npm run check 2>&1 | tee evidence/editor-protocol/check.log
      - name: Resolve 协议、状态、CLI 与只读投影测试（无 Resolve/GUI）
        run: |
          mkdir -p evidence/editor-protocol
          set -o pipefail
          npm run test:editor 2>&1 | tee evidence/editor-protocol/test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-protocol-evidence
          path: evidence/editor-protocol
          if-no-files-found: warn

  regression:
    if: github.event_name == 'push' || inputs.run_regression
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LMMS_APPIMAGE: ${{ github.workspace }}/tools/lmms-1.2.2-linux-x86_64.AppImage
      KDENLIVE_APPIMAGE: ${{ github.workspace }}/tools/kdenlive-26.08.1-x86_64.AppImage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 安装媒体与可访问性回归依赖
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg libopengl0 libegl1 libgl1 at-spi2-core python3-gi python3-gi-cairo gir1.2-atspi-2.0 python3-pyatspi
      - name: 下载 AppImage 测试夹具（与本机验证版本一致）
        run: |
          mkdir -p tools
          curl -fL --retry 3 -o "$LMMS_APPIMAGE" \
            https://github.com/LMMS/lmms/releases/download/v1.2.2/lmms-1.2.2-linux-x86_64.AppImage
          curl -fL --retry 3 -o "$KDENLIVE_APPIMAGE" \
            https://mirror.fcix.net/kdeftp/stable/kdenlive/26.08/linux/kdenlive-26.08.1-x86_64.AppImage
          chmod +x tools/*.AppImage
      - name: 全量回归（含 LMMS/Kdenlive 真实渲染冒烟）
        run: npm test

  gui-drills:
    if: github.event_name == 'push' || inputs.run_gui_drills
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      KDENLIVE_APPIMAGE: ${{ github.workspace }}/tools/kdenlive-26.08.1-x86_64.AppImage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 安装 X / AT-SPI 依赖
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb imagemagick x11-utils dbus dbus-x11 libopengl0 libegl1 libgl1 \
            at-spi2-core python3-gi python3-gi-cairo gir1.2-atspi-2.0 python3-pyatspi
      - name: 下载 Kdenlive AppImage
        run: |
          mkdir -p tools
          curl -fL --retry 3 -o "$KDENLIVE_APPIMAGE" \
            https://mirror.fcix.net/kdeftp/stable/kdenlive/26.08/linux/kdenlive-26.08.1-x86_64.AppImage
          chmod +x "$KDENLIVE_APPIMAGE"
      - name: 构建并生成临时工作区
        run: |
          npm run build
          npm run gui:renderer
          WS="$RUNNER_TEMP/ci-ws/demo"
          CONFIG="$RUNNER_TEMP/sample-a.json"
          cat > "$CONFIG" <<'JSON'
          {
            "schemaVersion": 1,
            "title": "CI 合成样例",
            "theme": "山间清晨",
            "moodArc": [{ "name": "舒展", "energy": 1 }],
            "duration": { "minSeconds": 30, "maxSeconds": 60 },
            "outputSpec": { "width": 1920, "height": 1080, "fps": 30 },
            "assets": [{ "sourceUrl": "https://example.invalid/video", "licenseUrl": "https://example.invalid/license" }]
          }
          JSON
          npm run cli -- init --workspace "$WS" --config "$CONFIG"
          mkdir -p "$WS/projects"
          cp templates/kdenlive/base.kdenlive "$WS/projects/final.kdenlive"
          echo "SENSE_WS=$WS" >> "$GITHUB_ENV"
      - name: 场景1 GUI 冒烟（GUI_SENSE=off）
        run: xvfb-run -a -s "-screen 0 1280x900x24" bash scripts/ci/smoke.sh evidence/ci
      - name: C9 降级（python3 缺失模拟 + 动作页逐视图）
        run: xvfb-run -a -s "-screen 0 1280x900x24" bash scripts/ci/degraded.sh evidence/ci
      - name: C1 感知演练（Kdenlive 打开/退出）
        run: dbus-run-session -- xvfb-run -a -s "-screen 0 1280x900x24" bash scripts/ci/sense.sh evidence/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase5-gui-evidence
          path: evidence/ci
          if-no-files-found: warn
