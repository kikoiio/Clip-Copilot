name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LMMS_APPIMAGE: ${{ github.workspace }}/tools/lmms-1.2.2-linux-x86_64.AppImage
      KDENLIVE_APPIMAGE: ${{ github.workspace }}/tools/kdenlive-26.08.1-x86_64.AppImage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 下载 AppImage 测试夹具（与本机验证版本一致）
        run: |
          mkdir -p tools
          curl -fL --retry 3 -o "$LMMS_APPIMAGE" \
            https://github.com/LMMS/lmms/releases/download/v1.2.2/lmms-1.2.2-linux-x86_64.AppImage
          curl -fL --retry 3 -o "$KDENLIVE_APPIMAGE" \
            https://download.kdenlive.org/download/releases/26.08.1/linux/kdenlive-26.08.1-x86_64.AppImage
          chmod +x tools/*.AppImage
      - name: 全量回归（含 LMMS/Kdenlive 真实渲染冒烟）
        run: npm test

  gui-drills:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      KDENLIVE_APPIMAGE: ${{ github.workspace }}/tools/kdenlive-26.08.1-x86_64.AppImage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 安装 X / AT-SPI 依赖
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb imagemagick x11-utils dbus dbus-x11 \
            at-spi2-core python3-gi python3-gi-cairo gir1.2-atspi-2.0 python3-pyatspi
      - name: 下载 Kdenlive AppImage
        run: |
          mkdir -p tools
          curl -fL --retry 3 -o "$KDENLIVE_APPIMAGE" \
            https://download.kdenlive.org/download/releases/26.08.1/linux/kdenlive-26.08.1-x86_64.AppImage
          chmod +x "$KDENLIVE_APPIMAGE"
      - name: 构建并生成临时工作区
        run: |
          npm run build
          npm run gui:renderer
          WS="$RUNNER_TEMP/ci-ws/demo"
          npm run cli -- init --workspace "$WS" --config docs/task-configs/sample-a.json
          mkdir -p "$WS/projects"
          cp templates/kdenlive/base.kdenlive "$WS/projects/final.kdenlive"
          echo "SENSE_WS=$WS" >> "$GITHUB_ENV"
      - name: 场景1 GUI 冒烟（GUI_SENSE=off）
        run: xvfb-run -a -s "-screen 0 1280x900x24" bash scripts/ci/smoke.sh evidence/ci
      - name: C9 降级（python3 缺失模拟 + 动作页逐视图）
        run: xvfb-run -a -s "-screen 0 1280x900x24" bash scripts/ci/degraded.sh evidence/ci
      - name: C1 感知演练（Kdenlive 打开/退出）
        run: dbus-run-session -- xvfb-run -a -s "-screen 0 1280x900x24" bash scripts/ci/sense.sh evidence/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase5-gui-evidence
          path: evidence/ci
          if-no-files-found: warn
